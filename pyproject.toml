[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fakebench-ts"
version = "0.1.0"
description = "Benchmark of time-series foundation models on random walks, where the best forecast is known exactly"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2",
    "pyarrow>=14",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
chronos = ["chronos-forecasting>=2.0"]

[project.scripts]
fakebench-ts = "fakebench_ts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fakebench_ts"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
